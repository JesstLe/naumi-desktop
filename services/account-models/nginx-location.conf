# Add to the SAME HTTPS vhost as Canvas; existing accounts and admin cookies stay same-origin.
location ^~ /api/desktop-models/ {
    proxy_pass http://127.0.0.1:3192;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_buffering off;
    proxy_read_timeout 310s;
    client_max_body_size 4m;
}
location = /admin/desktop-models {
    proxy_pass http://127.0.0.1:3192;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
}
